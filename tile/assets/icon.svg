<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：青绿色盾牌，里面一个白色倒计时环（和磁贴每行右边的环一样） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD8C8"/>
      <stop offset="0.55" stop-color="#17A898"/>
      <stop offset="1" stop-color="#0B7A70"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M128 14 C152 30 188 42 222 45 C229 46 234 51 234 58 V116 C234 184 190 228 128 246 C66 228 22 184 22 116 V58 C22 51 27 46 34 45 C68 42 104 30 128 14 Z" fill="url(#bg)"/>
  <path d="M128 14 C152 30 188 42 222 45 C229 46 234 51 234 58 V116 C234 184 190 228 128 246 C66 228 22 184 22 116 V58 C22 51 27 46 34 45 C68 42 104 30 128 14 Z" fill="url(#gloss)"/>
  <!-- 倒计时环：淡色底环 + 剩下 3/4 的白色弧 -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="22"/>
  <path d="M128 72 A56 56 0 1 1 72 128" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
</svg>
