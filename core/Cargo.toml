[package]
name = "authcore"
version = "0.3.0"
edition = "2024"

[dependencies]
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
